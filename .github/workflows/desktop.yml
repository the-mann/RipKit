name: Desktop builds
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node desktop/prepare.cjs
      - run: npx electron desktop/main.cjs --smoke-test
      - run: npx electron-builder --publish never
      - name: Test packaged Mac app
        if: runner.os == 'macOS'
        run: '"release/mac-arm64/RipKit.app/Contents/MacOS/RipKit" --smoke-test'
      - name: Test packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'release/win-unpacked/RipKit.exe' -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Desktop smoke test failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: RipKit-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
